<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <style>
    body { font-family: sans-serif; max-width: 450px; margin: 30px auto; padding: 15px; background: #f4f4f9; }
    .card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .plus { color: green; } .minus { color: red; }
    .del { width: auto; padding: 2px 8px; background: #dc2626; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="card" style="text-align: center;">
    <h3>Balance: ₹<span id="bal">0</span></h3>
    <p><span class="plus">Income: ₹<span id="inc">0</span></span> | <span class="minus">Expense: ₹<span id="exp">0</span></span></p>
  </div>
  <div class="card">
    <form id="form">
      <input type="text" id="text" placeholder="Item (e.g., Food, Salary)" required>
      <input type="number" id="amt" placeholder="Amount" required>
      <select id="type">
        <option value="exp">Expense (-)</option>
        <option value="inc">Income (+)</option>
      </select>
      <button type="submit">Add</button>
    </form>
  </div>
  <div class="card">
    <h4>History</h4>
    <ul id="list"></ul>
  </div>
  <script>
    let data = JSON.parse(localStorage.getItem('tx')) || [];
    function render() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      let inc = 0, exp = 0;
      data.forEach((item, i) => {
        item.type === 'inc' ? inc += item.amt : exp += item.amt;
        list.innerHTML += `
          <li>
            <span>${item.text}</span>
            <span class="${item.type === 'inc' ? 'plus' : 'minus'}">
              ${item.type === 'inc' ? '+' : '-'}₹${item.amt}
              <button class="del" onclick="del(${i})">X</button>
            </span>
          </li>`;
      });
      document.getElementById('bal').innerText = inc - exp;
      document.getElementById('inc').innerText = inc;
      document.getElementById('exp').innerText = exp;
      localStorage.setItem('tx', JSON.stringify(data));
    }
    document.getElementById('form').onsubmit = (e) => {
      e.preventDefault();
      data.push({
        text: document.getElementById('text').value,
        amt: +document.getElementById('amt').value,
        type: document.getElementById('type').value
      });
      e.target.reset();
      render();
    }; 
    function del(i) { data.splice(i, 1); render(); }
    render();
  </script>
</body>
</html>
